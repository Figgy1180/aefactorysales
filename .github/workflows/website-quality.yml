name: Website quality
on:
  pull_request:
    branches: [main, gpt]
  push:
    branches: [main, gpt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys-and-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:journeys
      - run: npm run audit:lighthouse
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: website-quality-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
            .lighthouseci/
          retention-days: 14
